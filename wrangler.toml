"$schema" = "./node_modules/wrangler/config-schema.json"
name = "ola-serena"
pages_build_output_dir = "./dist"
compatibility_date = "2026-08-26"
compatibility_flags = ["nodejs_compat"]

# Cloudflare Workers AI (free tier) — llama-3.1 + whisper + melotts
[ai]
binding = "AI"

# --- Local dev + production ---
[[kv_namespaces]]
binding = "CONTENT"
id = "09e7faead934494c8e48ffb806f0ed3e"

[vars]
SITE_NAME = "Ola Serena"

# CLOUDINARY_API_SECRET is set as a secret (never in source):
#   npx wrangler pages secret put CLOUDINARY_API_SECRET
# For this project, the current secret value is stored server-side only.

# --- Preview deployments ---
[[env.preview.kv_namespaces]]
binding = "CONTENT"
id = "e21d3f61654b4a11986a7ac04da9f018"

[env.preview.vars]
SITE_NAME = "Ola Serena (preview)"

# --- Production deployments ---
[[env.production.kv_namespaces]]
binding = "CONTENT"
id = "09e7faead934494c8e48ffb806f0ed3e"

[env.production.vars]
SITE_NAME = "Ola Serena"
