[ai]
binding = "AI"

"$schema" = "./node_modules/wrangler/config-schema.json"
name = "ola-serena"
pages_build_output_dir = "./dist"
compatibility_date = "2026-08-26"
compatibility_flags = ["nodejs_compat"]

# --- Local dev + production ---
[[kv_namespaces]]
binding = "CONTENT"
id = "1c21691d43504700aeddfc7095ef3a4d"

[vars]
SITE_NAME = "Ola Serena"

# --- Preview deployments ---
[[env.preview.kv_namespaces]]
binding = "CONTENT"
id = "ac1b24881dee4d13b6a175e4606d9575"

[env.preview.vars]
SITE_NAME = "Ola Serena (preview)"

# --- Production deployments ---
[[env.production.kv_namespaces]]
binding = "CONTENT"
id = "1c21691d43504700aeddfc7095ef3a4d"

[env.production.vars]
SITE_NAME = "Ola Serena"
