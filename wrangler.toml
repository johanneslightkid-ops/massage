"$schema" = "./node_modules/wrangler/config-schema.json"

# ---------------------------------------------------------------------------
# mobile-massage — one Worker serving the site, its API and its static assets.
#
#   https://mobile-massage.johannes-neugschwentner.workers.dev
#
# This replaced the two Pages projects (ola-serena, massage-playero). The KV
# namespace is the one massage-playero used, so every edit made in /admin,
# every booking and the admin password carried straight over.
# ---------------------------------------------------------------------------

name = "mobile-massage"
main = "worker/index.ts"
compatibility_date = "2026-08-26"
compatibility_flags = ["nodejs_compat"]
workers_dev = true
preview_urls = true

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
# Everything except the immutable build output goes through the Worker, so it
# can inline the content into each page. The hashed assets, icons and the
# link-preview image never touch it — they are served straight from the edge.
run_worker_first = ["/*", "!/assets/*", "!/favicon.svg", "!/og.jpg", "!/site.webmanifest"]

[observability]
enabled = true

[ai]
binding = "AI"

[[kv_namespaces]]
binding = "CONTENT"
id = "78cfcbe1fc734caea63722f90580297e"

[vars]
SITE_NAME = "Massage Playero"

# Cloudinary (optional — photo uploads fall back to inline WebP without it):
#   CLOUDINARY_CLOUD_NAME and CLOUDINARY_API_KEY as vars or secrets,
#   CLOUDINARY_API_SECRET as a secret:
#     npx wrangler secret put CLOUDINARY_API_SECRET
